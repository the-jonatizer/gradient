<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glow generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --body:#1c1c1a; --stage:#121211; --slot:#2c2c29; --line:#2e2e2b; --raise:#272725;
  --text:#ebe8df; --muted:#8a877d; --cap:#e2ded2; --orange:#ff6a1a;
  color-scheme:dark;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--body);color:var(--text);
  font-family:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:13px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

.app{display:flex;height:100%;min-height:0}
.stage{flex:1;min-width:0;position:relative;display:flex;align-items:center;justify-content:center;background:var(--stage);padding:32px 32px 48px}
canvas{display:block;cursor:grab;touch-action:none}
canvas.dragging{cursor:grabbing}
.hint{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:12px;color:var(--muted);pointer-events:none}

.panel{width:340px;flex:none;display:flex;flex-direction:column;border-left:1px solid var(--line);min-height:0}
.top{padding:22px 24px 20px;border-bottom:1px solid var(--line)}
.word{font-size:22px;font-weight:500;letter-spacing:-.02em;margin:0 0 18px;line-height:1}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:0;border-radius:6px;padding:10px 12px;background:var(--raise);font-weight:500;text-align:center}
.btn:hover{background:#30302d}
.save{display:flex;gap:8px;margin-top:8px}
.btn.primary{flex:1;background:var(--orange);color:#1a0d05}
.btn.primary:hover{background:#ff7c35}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:flex;background:var(--raise);border-radius:6px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:4px;font-size:12px}
.seg button[aria-pressed="true"]{background:#3a3a36;color:var(--text)}
.status{font-size:12px;color:var(--muted);margin-top:10px;min-height:17px}

.tabs{display:flex;gap:18px;padding:0 24px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:14px 0 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--text);border-color:var(--orange)}
.tabs button:hover{color:var(--text)}
.pane{flex:1;overflow-y:auto;padding:20px 24px 32px}
.pane[hidden]{display:none}
.sub{color:var(--muted);font-size:12px;margin:22px 0 10px}
.sub:first-child{margin-top:0}

.fader{margin-bottom:16px}
.fader div{display:flex;justify-content:space-between;margin-bottom:6px}
.fader label{color:var(--muted)}
.fader output{font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;margin:0;cursor:pointer;display:block}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:linear-gradient(to right,var(--text) 0 var(--fill,50%),var(--slot) var(--fill,50%))}
input[type=range]::-moz-range-track{height:2px;background:var(--slot)}
input[type=range]::-moz-range-progress{height:2px;background:var(--text)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--cap);margin-top:-6px;border:0}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--cap);border:0}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px var(--orange)}

.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--raise);border-radius:6px;padding:3px}
.grid3 button{border:0;background:transparent;color:var(--muted);padding:7px 0;border-radius:4px;font-size:12px}
.grid3 button[aria-pressed="true"]{background:#3a3a36;color:var(--text)}

.pal{display:flex;gap:12px;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;border:0;padding:0;position:relative}
.dot[aria-pressed="true"]::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--text)}
.sw{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.sw input{width:100%;height:20px;border:0;border-radius:3px;padding:0;background:none;cursor:pointer}
.sw input::-webkit-color-swatch-wrapper{padding:0}
.sw input::-webkit-color-swatch{border:none;border-radius:3px}
.sw input::-moz-color-swatch{border:none;border-radius:3px}

.switch{display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin-bottom:16px;color:var(--muted)}
.switch input{appearance:none;-webkit-appearance:none;width:30px;height:16px;border-radius:8px;background:var(--slot);position:relative;margin:0;cursor:pointer}
.switch input::before{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--muted);transition:left .12s}
.switch input:checked{background:var(--orange)}
.switch input:checked::before{left:16px;background:#fff}

.overlay{position:fixed;inset:0;background:rgba(10,10,9,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;z-index:20}
.overlay[hidden]{display:none}
.overlay img{max-width:min(90vw,900px);max-height:75vh;display:block}
.overlay p{margin:0;color:var(--text)}

@media (max-width:780px){
  .app{flex-direction:column;height:auto}
  .stage{flex:none;height:58vh;padding:16px}
  .panel{width:auto;border-left:0;border-top:1px solid var(--line)}
  .pane{overflow:visible}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){.switch input::before{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="stage" id="stage">
    <canvas id="c" aria-label="Generated gradient glow"></canvas>
    <div class="hint">Drag to move, scroll to zoom, space for a new shape.</div>
  </div>
  <aside class="panel">
    <div class="top">
      <div class="word">glow</div>
      <div class="row2">
        <button class="btn" id="shuffleShape" title="Space">New shape</button>
        <button class="btn" id="shuffleAll">Surprise me</button>
      </div>
      <div class="save">
        <button class="btn primary" id="export">Save PNG</button>
        <div class="seg" id="size"><button data-v="2000">2k</button><button data-v="4000" aria-pressed="true">4k</button></div>
      </div>
      <div class="status" id="status" role="status"></div>
    </div>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" data-t="shape" aria-selected="true">Shape</button>
      <button role="tab" data-t="colour">Colour</button>
      <button role="tab" data-t="glass">Glass</button>
      <button role="tab" data-t="grain">Grain</button>
      <button role="tab" data-t="frame">Frame</button>
    </div>
    <div class="pane" data-p="shape">
      <div class="sub">Start from</div>
      <div class="grid3" id="recipes"></div>
      <div class="sub">Form</div>
      <div id="g-shape"></div>
    </div>
    <div class="pane" data-p="colour" hidden>
      <div class="sub">Palette</div>
      <div class="pal" id="presets"></div>
      <div class="sub">Rim to core, then background</div>
      <div class="sw" id="swatches"></div>
      <div class="sub">Light</div>
      <div id="g-colour"></div>
    </div>
    <div class="pane" data-p="glass" hidden>
      <div class="sub">Type</div>
      <div class="grid3" id="glassKeys"></div>
      <div class="sub">&nbsp;</div>
      <div id="g-glass"></div>
    </div>
    <div class="pane" data-p="grain" hidden>
      <label class="switch">Live grain <input type="checkbox" id="grainLive"></label>
      <div id="g-grain"></div>
    </div>
    <div class="pane" data-p="frame" hidden>
      <div class="sub">Aspect ratio</div>
      <div class="seg" id="aspects" style="display:inline-flex"></div>
      <div class="sub">&nbsp;</div>
      <div id="g-frame"></div>
      <label class="switch">Drift <input type="checkbox" id="animate"></label>
      <div id="g-motion"></div>
    </div>
  </aside>
</div>
<div class="overlay" id="overlay" hidden>
  <img id="ovImg" alt="Rendered glow image">
  <p>Right-click or long-press the image to save it.</p>
  <button class="btn" id="ovClose">Close</button>
</div>
<script>
(function(){
const TAU=Math.PI*2;
const PALETTES={
  "Ember":["#1530e8","#2a8cff","#c3a6ec","#f27ad0","#ff7a1f","#ffd23f"],
  "Violet hour":["#2a0fd6","#6a3cff","#d7a6f5","#ff6fb5","#ff8a3d","#ffe0a0"],
  "Aurora":["#0b2cc9","#00a3ff","#5ef0d6","#c8f7a8","#fff2b0","#ffffff"],
  "Ultraviolet":["#3a00b8","#8a2cff","#ff3fd0","#ff7aa8","#ffc0d8","#fff4f8"],
  "Ice":["#0a1a80","#1c5cff","#7fb8ff","#d4e6ff","#f2f7ff","#ffffff"],
  "Sunset":["#4a0b9a","#d22d8a","#ff5a3c","#ff9a2e","#ffd66b","#fff3c4"]
};
const GLASS=["none","reeded","tiles","lenses","frosted","ripple"];
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const S={
  seed:7, lobes:3, size:.32, stretch:1.1, rotation:0, warp:.35,
  soft:.12, glow:.4, depth:.4, tilt:.6, tiltAngle:200,
  zoom:1, panX:0, panY:-.05,
  glass:"reeded", glassAmt:.45, glassCount:12, glassAngle:0, glassShade:.5, disp:.35,
  grain:.05, grainSize:1.4, grainColor:.25, grainResp:.6, grainLive:!reduce,
  animate:!reduce, speed:.5, aspect:"4:5",
  palette:"Ember", colors:PALETTES.Ember.slice(), bg:"#000000"
};
const RECIPES={
  "comet":{lobes:3,size:.32,stretch:1.1,rotation:0,warp:.35,soft:.12,depth:.4,tilt:.6,tiltAngle:200,zoom:1,panX:0,panY:-.05},
  "horizon":{lobes:1,size:.3,stretch:2.3,rotation:0,warp:.08,soft:.2,depth:.75,tilt:.75,tiltAngle:270,zoom:1,panX:0,panY:0},
  "close-up":{lobes:4,size:.5,stretch:1.3,rotation:-20,warp:.45,soft:.22,depth:.35,tilt:.55,tiltAngle:160,zoom:2.4,panX:-.08,panY:.06}
};
const f2=v=>v.toFixed(2),deg=v=>Math.round(v)+"°";
const SLIDERS=[
  ["shape","lobes","Lobes",1,5,1,v=>v],
  ["shape","size","Size",.15,.8,.01,f2],
  ["shape","stretch","Stretch",.4,3.5,.01,f2],
  ["shape","warp","Warp",0,1,.01,f2],
  ["colour","soft","Edge softness",.02,.45,.01,f2],
  ["colour","glow","Outer glow",0,1,.01,f2],
  ["colour","depth","Warm core",0,1,.01,f2],
  ["colour","tilt","Colour shift",0,1.2,.01,f2],
  ["colour","tiltAngle","Shift angle",0,360,1,deg],
  ["glass","glassAmt","Strength",0,1,.01,f2],
  ["glass","glassCount","Density",2,60,1,v=>v],
  ["glass","glassAngle","Angle",-90,90,1,deg],
  ["glass","glassShade","Highlights",0,1,.01,f2],
  ["glass","disp","Dispersion",0,1,.01,f2],
  ["grain","grain","Amount",0,.25,.005,v=>v.toFixed(3)],
  ["grain","grainSize","Size",.6,5,.1,v=>v.toFixed(1)],
  ["grain","grainColor","Colour",0,1,.01,f2],
  ["grain","grainResp","Midtones",0,1,.01,f2],
  ["frame","zoom","Zoom",.5,4,.01,v=>v.toFixed(2)+"×"],
  ["frame","rotation","Rotation",-180,180,1,deg],
  ["motion","speed","Speed",.05,2,.01,f2]
];
const ASPECTS={"4:5":[4,5],"1:1":[1,1],"3:2":[3,2],"16:9":[16,9],"9:16":[9,16]};

/* ---------- WebGL ---------- */
const canvas=document.getElementById("c");
const gl=canvas.getContext("webgl",{preserveDrawingBuffer:true,antialias:false});
const status=document.getElementById("status");
if(!gl)status.textContent="This browser can’t run WebGL, so the preview can’t render.";
const VS="attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}";
const FS=`precision highp float;
uniform vec2 uRes;uniform float uMin,uTime,uSeed,uFrame;
uniform vec4 uL[5];uniform vec2 uM[5];
uniform float uThr,uSoft,uGlow,uDepth,uTilt,uWarp,uZoom,uRot,uStretch;
uniform vec2 uDir,uPan;
uniform vec3 uC0,uC1,uC2,uC3,uC4,uC5,uBg;
uniform float uGrain,uGrainSize,uGrainColor,uGrainResp,uPx;
uniform int uGlass;uniform float uGAmt,uGCount,uGAngle,uGShade,uDisp;
float hash(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*f*(f*(f*6.-15.)+10.);
 return mix(mix(hash(i),hash(i+vec2(1.,0.)),u.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),u.x),u.y);}
float fbm(vec2 p){float v=0.,a=.65;for(int i=0;i<2;i++){v+=a*noise(p);p=p*1.9+vec2(1.7,9.2);a*=.35;}return v;}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
vec3 ramp(float t){t=clamp(t,0.,1.)*5.;
 vec3 c=mix(uC0,uC1,clamp(t,0.,1.));
 c=mix(c,uC2,clamp(t-1.,0.,1.));c=mix(c,uC3,clamp(t-2.,0.,1.));
 c=mix(c,uC4,clamp(t-3.,0.,1.));c=mix(c,uC5,clamp(t-4.,0.,1.));return c;}
vec3 scene(vec2 s){
 vec2 p=rot(uRot)*s;p=p/uZoom-uPan;
 vec2 w=vec2(fbm(p*.9+uSeed+uTime*.05),fbm(p*.9+uSeed+13.7-uTime*.05))-.4;
 vec2 pw=p+w*uWarp;vec2 q=pw;q.x/=uStretch;
 float F=0.;
 for(int i=0;i<5;i++){vec2 d=rot(uM[i].x)*(q-uL[i].xy);d/=uL[i].zw;F+=uM[i].y*exp(-dot(d,d));}
 float edge=smoothstep(uThr-uSoft,uThr+uSoft*.5,F);
 float core=smoothstep(uThr,uThr+mix(2.2,.7,uDepth),F);
 float t=clamp(.18+core*mix(.45,.95,uDepth)+dot(pw,uDir)*uTilt*2.2,0.,1.);
 vec3 col=mix(uBg,ramp(t),edge);
 col+=ramp(0.)*smoothstep(uThr-uSoft-.3,uThr,F)*uGlow*(1.-edge)*.55;
 return col;}
void main(){
 vec2 s=(gl_FragCoord.xy-.5*uRes)/uMin;
 vec2 g=rot(uGAngle)*s;
 vec2 off=vec2(0.);float hl=0.,sh=0.;
 float w=1./uGCount;
 if(uGlass==1){
  float f=fract(g.x*uGCount)-.5;
  off.x=-(f+1.2*f*f*f)*w*uGAmt*1.3;
  sh=pow(abs(2.*f),3.);hl=smoothstep(.28,.46,f)*(1.-smoothstep(.46,.5,f));
 }else if(uGlass==2){
  vec2 f=fract(g*uGCount)-.5;
  off=-(f+1.2*f*f*f)*w*uGAmt*1.3;
  vec2 a=pow(abs(2.*f),vec2(3.));sh=max(a.x,a.y);
  hl=smoothstep(.3,.47,f.x)*(1.-smoothstep(.47,.5,f.x))+smoothstep(.3,.47,f.y)*(1.-smoothstep(.47,.5,f.y));
 }else if(uGlass==3){
  vec2 c=g*uGCount;vec2 f=fract(c)-.5;float r=length(f);
  float m=1.-smoothstep(.42,.5,r);
  off=-f*w*uGAmt*3.*m;
  sh=smoothstep(.25,.5,r);
  hl=smoothstep(.12,.0,length(f-vec2(-.17,.17)))*m;
 }else if(uGlass==4){
  vec2 px=gl_FragCoord.xy/uPx;
  off=(vec2(hash(px),hash(px+31.7))-.5)*uGAmt*.09+(vec2(noise(g*uGCount*2.),noise(g*uGCount*2.+7.))-.5)*uGAmt*.05;
 }else if(uGlass==5){
  vec2 n=vec2(fbm(g*uGCount*.35+uTime*.05),fbm(g*uGCount*.35+5.2-uTime*.04))-.4;
  off=n*uGAmt*.38;
  hl=pow(max(0.,n.x+n.y),3.)*2.;
 }
 off=rot(-uGAngle)*off;
 vec3 col;
 if(uDisp>.001){
  vec2 dv=off*uDisp*.7+s*uDisp*.012;
  col=vec3(scene(s+off+dv).r,scene(s+off).g,scene(s+off-dv).b);
 }else col=scene(s+off);
 if(uGlass>0&&uGlass!=4){
  col*=1.-uGShade*.35*sh;
  float l=dot(col,vec3(.299,.587,.114));
  col+=vec3(hl*uGShade*(.06+.35*l));
 }
 if(uGlass==4)col=mix(col,vec3(dot(col,vec3(.333))),.04*uGAmt)+.012*uGAmt;
 vec2 gc=gl_FragCoord.xy/(uGrainSize*uPx);
 vec2 fo=vec2(uFrame*17.13,uFrame*9.71);
 float n1=noise(gc+fo)+noise(gc*1.73+fo+3.1)-1.;
 vec3 nc=vec3(n1,noise(gc+fo+11.3)+noise(gc*1.73+fo+8.2)-1.,noise(gc+fo+23.9)+noise(gc*1.73+fo+15.5)-1.);
 vec3 gn=mix(vec3(n1),nc,uGrainColor);
 float l=dot(col,vec3(.299,.587,.114));
 float resp=mix(1.,.25+3.*l*(1.-l)+.15,uGrainResp);
 col+=gn*uGrain*2.2*resp;
 col+=(hash(gl_FragCoord.yx*1.37+3.1)-.5)/255.;
 gl_FragColor=vec4(col,1.);}`;
let U={};
function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
if(gl){
  const prog=gl.createProgram();
  gl.attachShader(prog,compile(gl.VERTEX_SHADER,VS));gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(prog);gl.useProgram(prog);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(prog,"a");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  ["uRes","uMin","uTime","uSeed","uFrame","uL","uM","uThr","uSoft","uGlow","uDepth","uTilt","uWarp","uZoom","uRot","uStretch",
   "uDir","uPan","uC0","uC1","uC2","uC3","uC4","uC5","uBg","uGrain","uGrainSize","uGrainColor","uGrainResp","uPx",
   "uGlass","uGAmt","uGCount","uGAngle","uGShade","uDisp"].forEach(n=>U[n]=gl.getUniformLocation(prog,n));
}

/* ---------- shape ---------- */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
let base=[];
function genLobes(){
  const r=rng(S.seed*9973+17);base=[];
  for(let i=0;i<5;i++){
    const ang=r()*TAU,dist=i===0?0:.3+r()*.45;
    base.push({cx:Math.cos(ang)*dist,cy:Math.sin(ang)*dist*.75,sx:.55+r()*.45,sy:.45+r()*.4,
      a:r()*Math.PI,w:i===0?1:.55+r()*.5,ph:r()*TAU,fr:.6+r()*.8});
  }
}
function hex(h){const n=parseInt(h.slice(1),16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];}

let time=0,frame=0,previewW=1200;
function draw(){
  if(!gl)return;
  const W=canvas.width,H=canvas.height;
  gl.viewport(0,0,W,H);
  const L=[],M=[];let cx=0,cy=0,tw=0;
  for(let i=0;i<5;i++){
    const l=base[i],w=i<S.lobes?l.w:0;
    const x=(l.cx+.18*Math.sin(time*l.fr+l.ph))*S.size,y=(l.cy+.14*Math.cos(time*l.fr*.8+l.ph*1.3))*S.size;
    L.push(x,y,l.sx*S.size,l.sy*S.size);M.push(l.a+.25*Math.sin(time*.5*l.fr+l.ph),w);
    cx+=x*w;cy+=y*w;tw+=w;
  }
  cx/=tw;cy/=tw;for(let i=0;i<5;i++){L[i*4]-=cx;L[i*4+1]-=cy;}
  gl.uniform2f(U.uRes,W,H);gl.uniform1f(U.uMin,Math.min(W,H));
  gl.uniform1f(U.uTime,time);gl.uniform1f(U.uSeed,(S.seed%97)*1.37);gl.uniform1f(U.uFrame,frame);
  gl.uniform4fv(U.uL,L);gl.uniform2fv(U.uM,M);
  gl.uniform1f(U.uThr,.3);gl.uniform1f(U.uSoft,S.soft);gl.uniform1f(U.uGlow,S.glow);
  gl.uniform1f(U.uDepth,S.depth);gl.uniform1f(U.uTilt,S.tilt);gl.uniform1f(U.uWarp,S.warp);
  gl.uniform1f(U.uZoom,S.zoom);gl.uniform1f(U.uRot,S.rotation*Math.PI/180);gl.uniform1f(U.uStretch,S.stretch);
  const ta=S.tiltAngle*Math.PI/180;gl.uniform2f(U.uDir,Math.cos(ta),Math.sin(ta));
  gl.uniform2f(U.uPan,S.panX,S.panY);
  S.colors.forEach((c,i)=>gl.uniform3fv(U["uC"+i],hex(c)));gl.uniform3fv(U.uBg,hex(S.bg));
  gl.uniform1f(U.uPx,Math.max(W,H)/previewW);
  gl.uniform1f(U.uGrain,S.grain);gl.uniform1f(U.uGrainSize,S.grainSize);
  gl.uniform1f(U.uGrainColor,S.grainColor);gl.uniform1f(U.uGrainResp,S.grainResp);
  gl.uniform1i(U.uGlass,GLASS.indexOf(S.glass));gl.uniform1f(U.uGAmt,S.glassAmt);gl.uniform1f(U.uGCount,S.glassCount);
  gl.uniform1f(U.uGAngle,S.glassAngle*Math.PI/180);gl.uniform1f(U.uGShade,S.glassShade);gl.uniform1f(U.uDisp,S.disp);
  gl.drawArrays(gl.TRIANGLES,0,3);
}

/* ---------- sizing ---------- */
const stage=document.getElementById("stage");
function fit(){
  const cs=getComputedStyle(stage);
  const aw=stage.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const ah=stage.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const [a,b]=ASPECTS[S.aspect];let w=aw,h=aw*b/a;if(h>ah){h=ah;w=ah*a/b;}
  canvas.style.width=Math.floor(w)+"px";canvas.style.height=Math.floor(h)+"px";
  const dpr=Math.min(2,window.devicePixelRatio||1);
  let bw=Math.round(w*dpr),bh=Math.round(h*dpr);const m=Math.max(bw,bh);
  if(m>2200){bw=Math.round(bw*2200/m);bh=Math.round(bh*2200/m);}
  canvas.width=bw;canvas.height=bh;previewW=Math.max(bw,bh);dirty=true;
}
new ResizeObserver(fit).observe(stage);

/* ---------- loop ---------- */
let dirty=true,last=performance.now(),clock=0,exporting=false;
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;
  if(S.animate){time+=dt*S.speed;dirty=true;}
  if(S.grainLive){const f=Math.floor(clock*24)%997;if(f!==frame){frame=f;dirty=true;}}
  if(dirty&&!exporting){draw();dirty=false;}
  requestAnimationFrame(loop);
}

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
const inputs={};
function setFill(el){el.style.setProperty("--fill",(el.value-el.min)/(el.max-el.min)*100+"%");}
SLIDERS.forEach(([g,key,label,min,max,step,fmt])=>{
  const row=document.createElement("div");row.className="fader";const id="s-"+key;
  row.innerHTML=`<div><label for="${id}">${label}</label><output for="${id}"></output></div><input type="range" id="${id}" min="${min}" max="${max}" step="${step}">`;
  const input=row.querySelector("input"),out=row.querySelector("output");
  input.addEventListener("input",()=>{S[key]=parseFloat(input.value);out.textContent=fmt(S[key]);setFill(input);dirty=true;});
  inputs[key]={input,out,fmt};$("g-"+g).appendChild(row);
});
function press(sel,test){document.querySelectorAll(sel).forEach(b=>b.setAttribute("aria-pressed",test(b)));}
function syncUI(){
  for(const k in inputs){const {input,out,fmt}=inputs[k];input.value=S[k];out.textContent=fmt(S[k]);setFill(input);}
  $("animate").checked=S.animate;$("grainLive").checked=S.grainLive;
  press("#presets .dot",b=>b.dataset.name===S.palette);
  press("#aspects button",b=>b.dataset.a===S.aspect);
  press("#glassKeys button",b=>b.dataset.g===S.glass);
  const sw=document.querySelectorAll("#swatches input");S.colors.forEach((c,i)=>sw[i].value=c);sw[6].value=S.bg;
  document.querySelectorAll("#g-glass .fader").forEach(r=>r.style.opacity=S.glass==="none"&&!r.querySelector("#s-disp")?.35:1);
  dirty=true;
}
Object.entries(PALETTES).forEach(([name,cols])=>{
  const b=document.createElement("button");b.className="dot";b.dataset.name=name;b.title=name;b.setAttribute("aria-label",name);
  b.style.background=`conic-gradient(from 200deg,${cols.join(",")},${cols[0]})`;
  b.onclick=()=>{S.palette=name;S.colors=cols.slice();syncUI();};$("presets").appendChild(b);
});
for(let i=0;i<7;i++){
  const c=document.createElement("input");c.type="color";c.setAttribute("aria-label",i<6?`Colour ${i+1}`:"Background");
  c.addEventListener("input",()=>{if(i<6){S.colors[i]=c.value;S.palette="";}else S.bg=c.value;syncUI();});
  $("swatches").appendChild(c);
}
GLASS.forEach(g=>{
  const b=document.createElement("button");b.dataset.g=g;b.textContent=g[0].toUpperCase()+g.slice(1);
  b.onclick=()=>{S.glass=g;if(g==="frosted"&&S.glassCount>20)S.glassCount=8;syncUI();};$("glassKeys").appendChild(b);
});
Object.keys(ASPECTS).forEach(a=>{
  const b=document.createElement("button");b.dataset.a=a;b.textContent=a;
  b.onclick=()=>{S.aspect=a;syncUI();fit();};$("aspects").appendChild(b);
});
Object.entries(RECIPES).forEach(([name,r])=>{
  const b=document.createElement("button");b.textContent=name[0].toUpperCase()+name.slice(1);
  b.onclick=()=>{Object.assign(S,r);syncUI();press("#recipes button",x=>x===b);};$("recipes").appendChild(b);
});
let exportLong=4000;
document.querySelectorAll("#size button").forEach(b=>b.onclick=()=>{exportLong=+b.dataset.v;press("#size button",x=>x===b);});
$("animate").addEventListener("change",e=>{S.animate=e.target.checked;dirty=true;});
$("grainLive").addEventListener("change",e=>{S.grainLive=e.target.checked;if(!S.grainLive)frame=0;dirty=true;});

document.querySelectorAll("#tabs button").forEach(t=>t.onclick=()=>{
  document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-selected",x===t));
  document.querySelectorAll(".pane").forEach(p=>p.hidden=p.dataset.p!==t.dataset.t);
});
function newShape(){S.seed=Math.floor(Math.random()*1e6);genLobes();dirty=true;}
function surprise(){
  const r=Math.random;
  S.seed=Math.floor(r()*1e6);genLobes();
  S.lobes=1+Math.floor(r()*4);S.size=.25+r()*.2;
  S.stretch=r()<.3?1.8+r()*1.2:.8+r()*.6;
  S.warp=r()*.6;S.soft=.08+r()*.22;S.glow=.2+r()*.5;
  S.depth=.3+r()*.5;S.tilt=.3+r()*.6;S.tiltAngle=Math.floor(r()*360);
  S.zoom=r()<.25?1.8+r()*1.4:1;S.panX=S.zoom>1?(r()-.5)*.2:0;S.panY=S.zoom>1?(r()-.5)*.2:0;
  S.rotation=Math.floor((r()-.5)*60);
  const names=Object.keys(PALETTES);S.palette=names[Math.floor(r()*names.length)];S.colors=PALETTES[S.palette].slice();
  S.glass=r()<.35?"none":GLASS[1+Math.floor(r()*5)];
  S.glassAmt=.25+r()*.5;S.glassCount=S.glass==="lenses"||S.glass==="tiles"?4+Math.floor(r()*8):6+Math.floor(r()*24);
  S.glassAngle=r()<.6?0:Math.floor((r()-.5)*90);S.disp=r()*.6;
  S.grain=.03+r()*.09;S.grainSize=.8+r()*1.8;
  syncUI();
}
$("shuffleShape").onclick=newShape;$("shuffleAll").onclick=surprise;
document.addEventListener("keydown",e=>{
  if(e.code==="Space"&&!["INPUT","SELECT","BUTTON"].includes(document.activeElement.tagName)){e.preventDefault();newShape();}
});

let drag=null;
canvas.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId);canvas.classList.add("dragging");});
canvas.addEventListener("pointermove",e=>{
  if(!drag)return;
  const m=Math.min(canvas.clientWidth,canvas.clientHeight);
  const dx=(e.clientX-drag.x)/m/S.zoom,dy=-(e.clientY-drag.y)/m/S.zoom;
  const a=S.rotation*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
  S.panX+=c*dx+s*dy;S.panY+=-s*dx+c*dy;drag={x:e.clientX,y:e.clientY};dirty=true;
});
const endDrag=()=>{drag=null;canvas.classList.remove("dragging");};
canvas.addEventListener("pointerup",endDrag);canvas.addEventListener("pointercancel",endDrag);
canvas.addEventListener("wheel",e=>{
  e.preventDefault();S.zoom=Math.min(4,Math.max(.5,S.zoom*Math.exp(-e.deltaY*.0015)));
  const z=inputs.zoom;z.input.value=S.zoom;z.out.textContent=z.fmt(S.zoom);setFill(z.input);dirty=true;
},{passive:false});

/* ---------- save ---------- */
let downloads=null;const exportBtn=$("export");
(async function findDownloads(tries=0){
  if(window.claude&&typeof window.claude.use==="function"){
    try{downloads=await window.claude.use("downloads");}catch(e){downloads=null;}return;
  }
  if(tries<20)setTimeout(()=>findDownloads(tries+1),250);
})();
let ovURL=null;
function showOverlay(blob){
  if(ovURL)URL.revokeObjectURL(ovURL);ovURL=URL.createObjectURL(blob);
  $("ovImg").src=ovURL;$("overlay").hidden=false;$("ovClose").focus();
}
$("ovClose").onclick=()=>{$("overlay").hidden=true;exportBtn.focus();};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("overlay").hidden)$("ovClose").click();});
exportBtn.onclick=async()=>{
  if(!gl)return;
  const maxDim=Math.min(...gl.getParameter(gl.MAX_VIEWPORT_DIMS),gl.getParameter(gl.MAX_RENDERBUFFER_SIZE));
  const Lg=Math.min(exportLong,maxDim);const [a,b]=ASPECTS[S.aspect];
  const w=a>=b?Lg:Math.round(Lg*a/b),h=a>=b?Math.round(Lg*b/a):Lg;
  const pw=canvas.width,ph=canvas.height;
  exporting=true;exportBtn.disabled=true;status.textContent="Rendering…";
  await new Promise(r=>setTimeout(r,30));
  canvas.width=w;canvas.height=h;draw();
  const blob=await new Promise(res=>canvas.toBlob(res,"image/png"));
  canvas.width=pw;canvas.height=ph;exporting=false;exportBtn.disabled=false;dirty=true;
  if(!blob){status.textContent="The image couldn’t be rendered at that size. Try 2k.";return;}
  const name=`glow-${S.seed}-${w}x${h}.png`;
  if(!downloads){
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    status.textContent=`Saved ${w}×${h} PNG.`;return;
  }
  try{
    await downloads.save({filename:name,data:blob});
    status.textContent=`Saved ${w}×${h} PNG.`;
  }catch(err){
    const c=err&&err.code;
    if(c==="declined"){status.textContent="Save cancelled.";return;}
    if(c==="rate_limited"){status.textContent="A save is already waiting for you. Try again in a moment.";return;}
    status.textContent=`${w}×${h} rendered.`;showOverlay(blob);
  }
};

genLobes();syncUI();fit();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
